name: Build immutable images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: workflow-service
            dockerfile: infrastructure/docker/service.Dockerfile
            service: workflow-service
          - image: payment-service
            dockerfile: infrastructure/docker/service.Dockerfile
            service: payment-service
          - image: fulfilment-service
            dockerfile: infrastructure/docker/service.Dockerfile
            service: fulfilment-service
          - image: lab-console
            dockerfile: infrastructure/docker/service.Dockerfile
            service: lab-console
          - image: frontend
            dockerfile: infrastructure/docker/frontend.Dockerfile
            service: ''
          - image: tempo
            dockerfile: infrastructure/docker/tempo.Dockerfile
            service: ''
          - image: telemetry-gateway
            dockerfile: infrastructure/docker/telemetry-gateway.Dockerfile
            service: ''
          - image: grafana
            dockerfile: infrastructure/docker/grafana.Dockerfile
            service: ''
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.service && format('SERVICE={0}', matrix.service) || '' }}
          tags: ghcr.io/${{ github.repository_owner }}/eventlab/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true
