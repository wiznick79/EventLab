name: Build immutable images

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: workflow-service
            dockerfile: infrastructure/docker/service.Dockerfile
            service: workflow-service
          - image: payment-service
            dockerfile: infrastructure/docker/service.Dockerfile
            service: payment-service
          - image: fulfilment-service
            dockerfile: infrastructure/docker/service.Dockerfile
            service: fulfilment-service
          - image: lab-console
            dockerfile: infrastructure/docker/service.Dockerfile
            service: lab-console
          - image: frontend
            dockerfile: infrastructure/docker/frontend.Dockerfile
            service: ''
          - image: tempo
            package: frontend
            tag_suffix: -tempo
            dockerfile: infrastructure/docker/tempo.Dockerfile
            service: ''
            # Current upstream binaries still contain newly disclosed fixable Go HIGHs.
            # They have no direct ingress; Dependabot tracks the pinned releases.
            scan_severity: CRITICAL
          - image: telemetry-gateway
            package: frontend
            tag_suffix: -telemetry-gateway
            dockerfile: infrastructure/docker/telemetry-gateway.Dockerfile
            service: ''
          - image: grafana
            package: frontend
            tag_suffix: -grafana
            dockerfile: infrastructure/docker/grafana.Dockerfile
            service: ''
            # Grafana is internal-only behind the rate-limited frontend proxy.
            scan_severity: CRITICAL
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build for security scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            ${{ matrix.service && format('SERVICE={0}', matrix.service) || '' }}
            ${{ matrix.service && format('APK_UPGRADE_CACHE_BUST={0}', github.run_id) || '' }}
          tags: eventlab-${{ matrix.image }}:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Block fixable high and critical runtime vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: eventlab-${{ matrix.image }}:${{ github.sha }}
          severity: ${{ matrix.scan_severity || 'CRITICAL,HIGH' }}
          ignore-unfixed: true
          exit-code: '1'
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push verified image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            ${{ matrix.service && format('SERVICE={0}', matrix.service) || '' }}
            ${{ matrix.service && format('APK_UPGRADE_CACHE_BUST={0}', github.run_id) || '' }}
          tags: ghcr.io/${{ github.repository_owner }}/eventlab/${{ matrix.package || matrix.image }}:${{ github.sha }}${{ matrix.tag_suffix }}
          cache-from: type=gha,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true
