name: Destroy Azure environment

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: Environment to destroy
        required: true
        default: demo

permissions:
  contents: read
  id-token: write
  actions: write

concurrency:
  group: eventlab-azure-state
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: azure
    defaults:
      run:
        working-directory: infrastructure/terraform/application
    env:
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      GH_TOKEN: ${{ github.token }}
      TARGET_ENVIRONMENT: ${{ inputs.environment_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Validate target and allow runner state access
        id: state_firewall
        run: |
          [[ "$TARGET_ENVIRONMENT" =~ ^[a-z0-9][a-z0-9-]{1,14}$ ]] || { echo "Invalid environment name" >&2; exit 1; }
          RUNNER_IP="$(curl --fail --silent --show-error https://api.ipify.org)"
          [[ "$RUNNER_IP" =~ ^[0-9a-fA-F:.]+$ ]] || { echo "Invalid runner IP" >&2; exit 1; }
          echo "runner_ip=${RUNNER_IP}" >> "$GITHUB_OUTPUT"
          az storage account network-rule add --resource-group "${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            --account-name "${{ vars.TF_STATE_STORAGE_ACCOUNT }}" --ip-address "$RUNNER_IP" --only-show-errors
          for _ in $(seq 1 12); do
            az storage container show --auth-mode login --name "${{ vars.TF_STATE_CONTAINER }}" \
              --account-name "${{ vars.TF_STATE_STORAGE_ACCOUNT }}" --only-show-errors >/dev/null 2>&1 && break
            sleep 5
          done
          az storage container show --auth-mode login --name "${{ vars.TF_STATE_CONTAINER }}" \
            --account-name "${{ vars.TF_STATE_STORAGE_ACCOUNT }}" --only-show-errors >/dev/null
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.8
      - name: Initialize remote state
        run: >-
          terraform init -input=false
          -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}"
          -backend-config="key=${{ vars.TF_STATE_KEY_PREFIX }}/${{ inputs.environment_name }}.tfstate"
          -backend-config="use_oidc=true"
      - name: Destroy all state-owned resources
        run: >-
          terraform destroy -input=false -auto-approve -lock-timeout=5m
          -var="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}"
          -var="environment_name=${{ inputs.environment_name }}"
          -var="destroy_after=2099-01-01T00:00:00Z"
          -var="image_tag=0000000000000000000000000000000000000000"
      - name: Verify environment resources were deleted
        run: |
          REMAINING="$(az resource list --resource-group "${{ vars.AZURE_ENVIRONMENT_RESOURCE_GROUP }}" \
            --query "[?tags.project=='eventlab' && tags.environment=='$TARGET_ENVIRONMENT'].id" -o tsv)"
          if [[ -n "$REMAINING" ]]; then
            echo "Tagged resources remain after destroy: $REMAINING" >&2
            exit 1
          fi
      - name: Publish offline live-lab status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run portfolio.yml --ref main -f live_state=offline \
            -f environment_name="$TARGET_ENVIRONMENT" \
            -f updated_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
      - name: Remove runner access to Terraform state
        if: always() && steps.state_firewall.outputs.runner_ip != ''
        run: |
          az storage account network-rule remove --resource-group "${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            --account-name "${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            --ip-address "${{ steps.state_firewall.outputs.runner_ip }}" --only-show-errors
