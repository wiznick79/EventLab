name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify backend
        run: ./mvnw -B -ntp verify

  frontend:
    name: Frontend verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose config --quiet

  integration:
    name: Broker and database integration
    runs-on: ubuntu-latest
    env:
      EVENTLAB_MESSAGING_ENABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Package services
        run: ./mvnw -B -ntp -DskipTests package
      - name: Start real infrastructure and services
        env:
          ACCEPT_EULA: Y
        run: |
          docker compose up -d --wait postgres servicebus
          for _ in $(seq 1 60); do
            docker compose logs servicebus 2>&1 | grep -q 'Emulator Service is Successfully Up!' && break
            sleep 2
          done
          docker compose logs servicebus 2>&1 | grep -q 'Emulator Service is Successfully Up!'
          mkdir -p /tmp/eventlab-logs
          java -jar services/workflow-service/target/workflow-service-*.jar >/tmp/eventlab-logs/workflow.log 2>&1 &
          java -jar services/payment-service/target/payment-service-*.jar >/tmp/eventlab-logs/payment.log 2>&1 &
          java -jar services/fulfilment-service/target/fulfilment-service-*.jar >/tmp/eventlab-logs/fulfilment.log 2>&1 &
          java -jar services/lab-console/target/lab-console-*.jar >/tmp/eventlab-logs/console.log 2>&1 &
          for PORT in 38080 38081 38082 38083; do
            for _ in $(seq 1 90); do
              curl --fail --silent "http://localhost:${PORT}/actuator/health" >/dev/null && break
              sleep 2
            done
            curl --fail --silent "http://localhost:${PORT}/actuator/health" >/dev/null
          done
      - name: Prove one end-to-end workflow
        run: |
          KEY="$(uuidgen)"
          RUN="$(curl --fail --silent --show-error -H 'Content-Type: application/json' \
            -H "Idempotency-Key: $KEY" \
            -d "{\"scenarioId\":\"happy-path\",\"amount\":129.90,\"currency\":\"EUR\",\"idempotencyKey\":\"$KEY\"}" \
            http://localhost:38080/api/v1/runs)"
          WORKFLOW_ID="$(jq -er '.workflowId' <<< "$RUN")"
          for _ in $(seq 1 45); do
            EVIDENCE="$(curl --fail --silent "http://localhost:38080/api/v1/runs/${WORKFLOW_ID}/evidence")"
            jq -e '.assessment == "PROVED"' <<< "$EVIDENCE" >/dev/null && exit 0
            sleep 2
          done
          exit 1
      - name: Show logs on failure
        if: failure()
        run: tail -n 200 /tmp/eventlab-logs/*.log || true
      - name: Stop integration environment
        if: always()
        run: docker compose down --volumes
