name: Clean up expired Azure environment

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: eventlab-azure-state
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: azure
    defaults:
      run:
        working-directory: infrastructure/terraform/application
    env:
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Inspect expiry tags
        id: expiry
        run: |
          NOW="$(date -u +%s)"
          EXPIRED_ENVIRONMENTS=""
          while IFS=$'\t' read -r NAME ENVIRONMENT EXPIRY; do
            [ -z "$NAME" ] && continue
            if [ -z "$ENVIRONMENT" ] || [ -z "$EXPIRY" ]; then
              echo "Ephemeral group ${NAME} is missing environment or destroy_after metadata" >&2
              exit 1
            fi
            if [ "$(date -u -d "$EXPIRY" +%s)" -le "$NOW" ]; then
              EXPIRED_ENVIRONMENTS="${EXPIRED_ENVIRONMENTS} ${ENVIRONMENT}"
            fi
          done < <(az group list --tag project=eventlab \
            --query "[?tags.lifecycle=='ephemeral'].[name,tags.environment,tags.destroy_after]" -o tsv)
          echo "environments=${EXPIRED_ENVIRONMENTS# }" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v4
        if: steps.expiry.outputs.environments != ''
        with:
          terraform_version: 1.15.8
      - name: Initialize remote state
        if: steps.expiry.outputs.environments != ''
        run: |
          for ENVIRONMENT in ${{ steps.expiry.outputs.environments }}; do
            terraform init -input=false -reconfigure \
              -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
              -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
              -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
              -backend-config="key=${{ vars.TF_STATE_KEY_PREFIX }}/${ENVIRONMENT}.tfstate" \
              -backend-config="use_oidc=true"
            terraform destroy -input=false -auto-approve -lock-timeout=5m \
              -var="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}" \
              -var="environment_name=${ENVIRONMENT}" \
              -var="destroy_after=2099-01-01T00:00:00Z" \
              -var="image_tag=0000000000000000000000000000000000000000"
            if az group show --name "rg-eventlab-${ENVIRONMENT}" >/dev/null 2>&1; then
              echo "Resource group rg-eventlab-${ENVIRONMENT} remains after cleanup" >&2
              exit 1
            fi
          done
