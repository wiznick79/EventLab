name: Clean up expired Azure environment

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: write

concurrency:
  group: eventlab-azure-state
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: azure-cleanup
    defaults:
      run:
        working-directory: infrastructure/terraform/application
    env:
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Allow this runner to reach Terraform state
        id: state_firewall
        run: |
          RUNNER_IP="$(curl --fail --silent --show-error https://api.ipify.org)"
          [[ "$RUNNER_IP" =~ ^[0-9a-fA-F:.]+$ ]] || { echo "Invalid runner IP" >&2; exit 1; }
          echo "runner_ip=${RUNNER_IP}" >> "$GITHUB_OUTPUT"
          az storage account network-rule add --resource-group "${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            --account-name "${{ vars.TF_STATE_STORAGE_ACCOUNT }}" --ip-address "$RUNNER_IP" \
            --only-show-errors --output none
          SUCCESSFUL_PROBES=0
          for _ in $(seq 1 36); do
            if az storage container show --auth-mode login --name "${{ vars.TF_STATE_CONTAINER }}" \
              --account-name "${{ vars.TF_STATE_STORAGE_ACCOUNT }}" --only-show-errors >/dev/null 2>&1; then
              SUCCESSFUL_PROBES=$((SUCCESSFUL_PROBES + 1))
              [[ "$SUCCESSFUL_PROBES" -ge 3 ]] && break
            else
              SUCCESSFUL_PROBES=0
            fi
            sleep 5
          done
          [[ "$SUCCESSFUL_PROBES" -ge 3 ]] || { echo "Terraform state firewall did not stabilize" >&2; exit 1; }
      - name: Inspect expiry tags
        id: expiry
        run: |
          NOW="$(date -u +%s)"
          EXPIRED_ENVIRONMENTS='[]'
          RESOURCES="$(az resource list --resource-group "${{ vars.AZURE_ENVIRONMENT_RESOURCE_GROUP }}" \
            --query "[?tags.project=='eventlab' && tags.lifecycle=='ephemeral'].{name:name,environment:tags.environment,expiry:tags.destroy_after}" -o json)"
          while IFS=$'\t' read -r NAME ENVIRONMENT EXPIRY; do
            [[ -z "$NAME" ]] && continue
            if [[ ! "$ENVIRONMENT" =~ ^[a-z0-9][a-z0-9-]{1,14}$ ]] || [[ -z "$EXPIRY" ]]; then
              echo "Ephemeral resource ${NAME} has invalid lifecycle metadata" >&2
              exit 1
            fi
            if [ "$(date -u -d "$EXPIRY" +%s)" -le "$NOW" ]; then
              EXPIRED_ENVIRONMENTS="$(jq --arg environment "$ENVIRONMENT" '. + [$environment] | unique' <<< "$EXPIRED_ENVIRONMENTS")"
            fi
          done < <(jq -r '.[] | [.name, .environment, .expiry] | @tsv' <<< "$RESOURCES")
          echo "environments=$(jq -c . <<< "$EXPIRED_ENVIRONMENTS")" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        if: steps.expiry.outputs.environments != '[]'
        with:
          terraform_version: 1.15.8
      - name: Initialize remote state
        if: steps.expiry.outputs.environments != '[]'
        env:
          EXPIRED_ENVIRONMENTS_JSON: ${{ steps.expiry.outputs.environments }}
        run: |
          while IFS= read -r ENVIRONMENT; do
            terraform init -input=false -reconfigure \
              -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
              -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
              -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
              -backend-config="key=${{ vars.TF_STATE_KEY_PREFIX }}/${ENVIRONMENT}.tfstate" \
              -backend-config="use_oidc=true"
            terraform destroy -input=false -auto-approve -lock-timeout=5m \
              -var="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}" \
              -var="environment_name=${ENVIRONMENT}" \
              -var="destroy_after=2099-01-01T00:00:00Z" \
              -var="image_tag=0000000000000000000000000000000000000000"
            REMAINING="$(az resource list --resource-group "${{ vars.AZURE_ENVIRONMENT_RESOURCE_GROUP }}" \
              --query "[?tags.project=='eventlab' && tags.environment=='$ENVIRONMENT'].id" -o tsv)"
            if [[ -n "$REMAINING" ]]; then
              echo "Tagged resources remain after cleanup for $ENVIRONMENT" >&2
              exit 1
            fi
          done < <(jq -r '.[]' <<< "$EXPIRED_ENVIRONMENTS_JSON")
      - name: Publish offline live-lab status
        if: steps.expiry.outputs.environments != '[]'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPIRED_ENVIRONMENTS_JSON: ${{ steps.expiry.outputs.environments }}
        run: |
          STATUS_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${{ github.event.repository.name }}/live-lab.json"
          CURRENT_ENVIRONMENT="$(curl --fail --silent --show-error --max-time 10 "$STATUS_URL" | jq -r '.environment // empty' || true)"
          jq -e --arg environment "$CURRENT_ENVIRONMENT" 'index($environment) != null' \
            <<< "$EXPIRED_ENVIRONMENTS_JSON" >/dev/null || exit 0
          gh workflow run portfolio.yml --ref main -f live_state=offline \
            -f environment_name="$CURRENT_ENVIRONMENT" \
            -f updated_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
      - name: Remove runner access to Terraform state
        if: always() && steps.state_firewall.outputs.runner_ip != ''
        run: |
          az storage account network-rule remove --resource-group "${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            --account-name "${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            --ip-address "${{ steps.state_firewall.outputs.runner_ip }}" --only-show-errors
