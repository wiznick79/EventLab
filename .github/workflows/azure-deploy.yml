name: Deploy Azure environment

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: Short environment name
        required: true
        default: demo
      lifetime_hours:
        description: Environment lifetime
        required: true
        type: choice
        options: ['2', '8', '24']
      image_tag:
        description: Full image commit SHA; defaults to the selected branch SHA
        required: false

permissions:
  contents: read
  id-token: write
  actions: write

concurrency:
  group: eventlab-azure-state
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: azure
    defaults:
      run:
        working-directory: infrastructure/terraform/application
    env:
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Allow this runner to reach Terraform state
        id: state_firewall
        run: |
          RUNNER_IP="$(curl --fail --silent --show-error https://api.ipify.org)"
          [[ "$RUNNER_IP" =~ ^[0-9a-fA-F:.]+$ ]] || { echo "Invalid runner IP" >&2; exit 1; }
          echo "runner_ip=${RUNNER_IP}" >> "$GITHUB_OUTPUT"
          az storage account network-rule add \
            --resource-group "${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            --account-name "${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            --ip-address "$RUNNER_IP" --only-show-errors --output none
          SUCCESSFUL_PROBES=0
          for _ in $(seq 1 36); do
            if az storage container show --auth-mode login --name "${{ vars.TF_STATE_CONTAINER }}" \
              --account-name "${{ vars.TF_STATE_STORAGE_ACCOUNT }}" --only-show-errors >/dev/null 2>&1; then
              SUCCESSFUL_PROBES=$((SUCCESSFUL_PROBES + 1))
              [[ "$SUCCESSFUL_PROBES" -ge 3 ]] && break
            else
              SUCCESSFUL_PROBES=0
            fi
            sleep 5
          done
          [[ "$SUCCESSFUL_PROBES" -ge 3 ]] || { echo "Terraform state firewall did not stabilize" >&2; exit 1; }
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.9
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Initialize remote state
        run: >-
          terraform init -input=false
          -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}"
          -backend-config="key=${{ vars.TF_STATE_KEY_PREFIX }}/${{ inputs.environment_name }}.tfstate"
          -backend-config="use_oidc=true"
          -backend-config="use_azuread_auth=true"
      - name: Plan immutable deployment
        id: plan
        env:
          REQUESTED_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          IMAGE_TAG="${REQUESTED_IMAGE_TAG:-$(gh run list --workflow images.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha')}"
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "No successful immutable image set found" >&2; exit 1; }
          REGISTRY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/eventlab"
          declare -A REFERENCES=(
            [workflow]="$REGISTRY/workflow-service:$IMAGE_TAG"
            [payment]="$REGISTRY/payment-service:$IMAGE_TAG"
            [fulfilment]="$REGISTRY/fulfilment-service:$IMAGE_TAG"
            [console]="$REGISTRY/lab-console:$IMAGE_TAG"
            [frontend]="$REGISTRY/frontend:$IMAGE_TAG"
            [tempo]="$REGISTRY/frontend:$IMAGE_TAG-tempo"
            [telemetry_gateway]="$REGISTRY/frontend:$IMAGE_TAG-telemetry-gateway"
            [grafana]="$REGISTRY/frontend:$IMAGE_TAG-grafana"
          )
          DIGESTS='{}'
          for NAME in "${!REFERENCES[@]}"; do
            DIGEST="$(docker buildx imagetools inspect "${REFERENCES[$NAME]}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Invalid digest for $NAME" >&2; exit 1; }
            DIGESTS="$(jq --arg name "$NAME" --arg digest "$DIGEST" '. + {($name):$digest}' <<< "$DIGESTS")"
          done
          DESTROY_AFTER="$(date -u -d '+${{ inputs.lifetime_hours }} hours' '+%Y-%m-%dT%H:%M:%SZ')"
          echo "destroy_after=${DESTROY_AFTER}" >> "$GITHUB_OUTPUT"
          jq -n --argjson digests "$DIGESTS" '{image_digests:$digests}' > deployment.auto.tfvars.json
          terraform plan -input=false -lock-timeout=5m \
            -var="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}" \
            -var="environment_name=${{ inputs.environment_name }}" \
            -var="destroy_after=${DESTROY_AFTER}" \
            -var="image_tag=${IMAGE_TAG}" \
            -out=application.tfplan
      - name: Apply saved plan
        run: terraform apply -input=false -auto-approve application.tfplan
      - name: Provision least-privilege database roles
        run: |
          RESOURCE_GROUP="$(terraform output -raw resource_group_name)"
          JOB_NAME="$(terraform output -raw database_role_job_name)"
          EXECUTION="$(az containerapp job start --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" --query name -o tsv)"
          for _ in $(seq 1 60); do
            STATUS="$(az containerapp job execution list --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" \
              --query "[?name=='$EXECUTION'].properties.status | [0]" -o tsv)"
            [[ "$STATUS" == "Succeeded" ]] && break
            [[ "$STATUS" == "Failed" ]] && { echo "Database role job failed" >&2; exit 1; }
            sleep 5
          done
          [[ "$STATUS" == "Succeeded" ]] || { echo "Database role job timed out" >&2; exit 1; }
      - name: Wait for application readiness
        run: |
          URL="$(terraform output -raw frontend_url)"
          DEADLINE=$((SECONDS + 600))
          while (( SECONDS < DEADLINE )); do
            STATUS="$(curl --fail --silent --connect-timeout 5 --max-time 10 \
              "${URL}/api/v1/deployment/status" 2>/dev/null || true)"
            if jq -e '
              .mode == "ONLINE"
              and .acceptingExperiments == true
              and .evidencePipeline.enabled == true
              and .evidencePipeline.status == "RUNNING"
              and ([.dependencies[] | select(.status == "UP")] | length == 3)
            ' <<< "$STATUS" >/dev/null 2>&1; then
              echo "Application dependencies reported ready" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "Application did not become ready after database provisioning" >&2
          exit 1
      - name: Smoke test happy path
        run: |
          URL="$(terraform output -raw frontend_url)"
          curl --fail --connect-timeout 10 --max-time 30 --retry 20 --retry-all-errors --retry-delay 15 "${URL}/"
          IDEMPOTENCY_KEY="$(uuidgen)"
          RUN="$(curl --fail --connect-timeout 10 --max-time 30 --retry 10 --retry-all-errors --retry-delay 10 \
            -H 'Content-Type: application/json' \
            -H "Idempotency-Key: ${IDEMPOTENCY_KEY}" \
            -d "{\"scenarioId\":\"happy-path\",\"amount\":129.90,\"currency\":\"EUR\",\"idempotencyKey\":\"${IDEMPOTENCY_KEY}\"}" \
            "${URL}/api/v1/runs")"
          WORKFLOW_ID="$(jq -r '.workflowId' <<< "$RUN")"
          for _ in $(seq 1 30); do
            TIMELINE="$(curl --fail --connect-timeout 10 --max-time 30 "${URL}/api/v1/runs/${WORKFLOW_ID}/timeline")"
            if jq -e 'any(.[]; .state == "COMPLETED")' <<< "$TIMELINE" >/dev/null; then
              echo "Azure happy-path completed for ${WORKFLOW_ID}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "Happy-path did not complete" >&2
          exit 1
      - name: Smoke test public trace viewer
        run: |
          URL="$(terraform output -raw frontend_url)"
          GRAFANA_URL="$(terraform output -raw grafana_url)"
          IDEMPOTENCY_KEY="$(uuidgen)"
          RUN="$(curl --fail --connect-timeout 10 --max-time 30 \
            -H 'Content-Type: application/json' \
            -H "Idempotency-Key: ${IDEMPOTENCY_KEY}" \
            -d "{\"scenarioId\":\"duplicate-payment-result\",\"amount\":129.90,\"currency\":\"EUR\",\"idempotencyKey\":\"${IDEMPOTENCY_KEY}\"}" \
            "${URL}/api/v1/runs")"
          WORKFLOW_ID="$(jq -er '.workflowId' <<< "$RUN")"

          for _ in $(seq 1 30); do
            TIMELINE="$(curl --fail --connect-timeout 10 --max-time 30 \
              "${URL}/api/v1/runs/${WORKFLOW_ID}/timeline")"
            TRACE_ID="$(jq -er \
              '[.[] | select(.duplicateDelivery == true and .state == "DUPLICATE_IGNORED")][0].traceId // empty' \
              <<< "$TIMELINE" 2>/dev/null || true)"
            COMPLETED="$(jq -r 'any(.[]; .state == "COMPLETED")' <<< "$TIMELINE")"
            if [[ -n "$TRACE_ID" && "$COMPLETED" == "true" ]]; then
              break
            fi
            sleep 5
          done

          if [[ -z "$TRACE_ID" || "$COMPLETED" != "true" ]]; then
            echo "Duplicate scenario did not expose its ignored delivery and completion" >&2
            exit 1
          fi

          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
              "${GRAFANA_URL}/api/datasources/proxy/uid/tempo/api/traces/${TRACE_ID}" \
              | jq -e '.batches | length > 0' >/dev/null; then
              echo "Public Grafana resolved duplicate trace ${TRACE_ID} for ${WORKFLOW_ID}" \
                >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done

          echo "Public Grafana could not resolve trace ${TRACE_ID}" >&2
          exit 1
      - name: Smoke test Control Center and Run Inspector
        run: |
          URL="$(terraform output -raw frontend_url)"
          STATUS="$(curl --fail --connect-timeout 10 --max-time 30 "${URL}/api/v1/deployment/status")"
          jq -e '
            .mode == "ONLINE"
            and .acceptingExperiments == true
            and .evidencePipeline.enabled == true
            and .evidencePipeline.status == "RUNNING"
            and (.expiresAt | type == "string")
            and ([.dependencies[] | select(.status == "UP")] | length == 3)
          ' <<< "$STATUS" >/dev/null

          IDEMPOTENCY_KEY="$(uuidgen)"
          RUN="$(curl --fail --connect-timeout 10 --max-time 30 \
            -H 'Content-Type: application/json' \
            -H "Idempotency-Key: ${IDEMPOTENCY_KEY}" \
            -d "{\"scenarioId\":\"custom-plan\",\"experimentPlan\":{\"paymentResultDeliveries\":2,\"fulfilmentBehavior\":\"SUCCESS\",\"fulfilmentMaxAttempts\":4,\"recoveryMode\":\"MANUAL\"},\"amount\":129.90,\"currency\":\"EUR\",\"idempotencyKey\":\"${IDEMPOTENCY_KEY}\"}" \
            "${URL}/api/v1/runs")"
          WORKFLOW_ID="$(jq -er '.workflowId' <<< "$RUN")"
          curl --fail --silent --show-error "${URL}/runs/${WORKFLOW_ID}" | grep -q 'id="root"'

          for _ in $(seq 1 30); do
            EVIDENCE="$(curl --fail --connect-timeout 10 --max-time 30 \
              "${URL}/api/v1/runs/${WORKFLOW_ID}/evidence")"
            if jq -e '.assessment == "PROVED" and ([.checks[] | select(.status == "PROVED")] | length == 3)' \
              <<< "$EVIDENCE" >/dev/null; then
              echo "Control Center, custom builder, direct route, and evidence report passed for ${WORKFLOW_ID}" \
                >> "$GITHUB_STEP_SUMMARY"
              break
            fi
            sleep 5
          done
          jq -e '.assessment == "PROVED"' <<< "$EVIDENCE" >/dev/null
          CONSISTENCY="$(curl --fail --connect-timeout 10 --max-time 30 \
            "${URL}/api/v1/runs/${WORKFLOW_ID}/consistency")"
          jq -e '
            .status == "CONSISTENT"
            and .authoritativeState == "COMPLETED"
            and .projectedState == "COMPLETED"
          ' <<< "$CONSISTENCY" >/dev/null
      - name: Smoke test poison-message quarantine
        run: |
          URL="$(terraform output -raw frontend_url)"
          IDEMPOTENCY_KEY="$(uuidgen)"
          RUN="$(curl --fail --connect-timeout 10 --max-time 30 \
            -H 'Content-Type: application/json' \
            -H "Idempotency-Key: ${IDEMPOTENCY_KEY}" \
            -d "{\"scenarioId\":\"custom-plan\",\"experimentPlan\":{\"paymentResultDeliveries\":1,\"fulfilmentBehavior\":\"UNSUPPORTED_CONTRACT\",\"fulfilmentMaxAttempts\":4,\"recoveryMode\":\"MANUAL\"},\"amount\":42.00,\"currency\":\"EUR\",\"idempotencyKey\":\"${IDEMPOTENCY_KEY}\"}" \
            "${URL}/api/v1/runs")"
          WORKFLOW_ID="$(jq -er '.workflowId' <<< "$RUN")"

          for _ in $(seq 1 30); do
            EVIDENCE="$(curl --fail --connect-timeout 10 --max-time 30 \
              "${URL}/api/v1/runs/${WORKFLOW_ID}/evidence")"
            if jq -e '
              .assessment == "PROVED"
              and ([.checks[] | select(.id == "contract-rejections" and .status == "PROVED")] | length == 1)
              and ([.checks[] | select(.id == "poison-dead-letter" and .status == "PROVED")] | length == 1)
              and ([.timeline[] | select(.state == "FULFILLED")] | length == 0)
            ' <<< "$EVIDENCE" >/dev/null; then
              echo "Poison-message quarantine passed for ${WORKFLOW_ID}" >> "$GITHUB_STEP_SUMMARY"
              break
            fi
            sleep 5
          done
          jq -e '.assessment == "PROVED"' <<< "$EVIDENCE" >/dev/null
          DEAD_LETTER="$(curl --fail --connect-timeout 10 --max-time 30 \
            "${URL}/api/v1/runs/${WORKFLOW_ID}/dead-letter")"
          jq -e '
            .status == "FOUND"
            and .queue == "fulfilment-commands/$deadletterqueue"
            and .deadLetterReason == "UnsupportedContractVersion"
            and .schemaVersion == 99
            and .replayAllowed == false
          ' <<< "$DEAD_LETTER" >/dev/null
      - name: Publish live-lab status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL="$(terraform output -raw frontend_url)"
          gh workflow run portfolio.yml --ref main \
            -f live_state=online -f live_url="$URL" \
            -f expires_at="${{ steps.plan.outputs.destroy_after }}" \
            -f environment_name="${{ inputs.environment_name }}" \
            -f updated_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
      - name: Publish environment summary
        if: always()
        run: |
          echo "### EventLab Azure environment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Expires: ${{ steps.plan.outputs.destroy_after }}" >> "$GITHUB_STEP_SUMMARY"
          terraform output -raw frontend_url 2>/dev/null | sed 's/^/- EventLab: /' >> "$GITHUB_STEP_SUMMARY" || true
          terraform output -raw grafana_url 2>/dev/null | sed 's/^/- Grafana: /' >> "$GITHUB_STEP_SUMMARY" || true
      - name: Remove runner access to Terraform state
        if: always() && steps.state_firewall.outputs.runner_ip != ''
        run: |
          az storage account network-rule remove \
            --resource-group "${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            --account-name "${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            --ip-address "${{ steps.state_firewall.outputs.runner_ip }}" --only-show-errors
