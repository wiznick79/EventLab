name: Deploy Azure environment

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: Short environment name
        required: true
        default: demo
      lifetime_hours:
        description: Environment lifetime
        required: true
        type: choice
        options: ['2', '8', '24']
      image_tag:
        description: Full image commit SHA; defaults to the selected branch SHA
        required: false

permissions:
  contents: write
  id-token: write
  actions: write

concurrency:
  group: eventlab-azure-state
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: azure
    defaults:
      run:
        working-directory: infrastructure/terraform/application
    env:
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Register Container Apps provider
        run: az provider register --namespace Microsoft.App --wait
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
      - name: Initialize remote state
        run: >-
          terraform init -input=false
          -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}"
          -backend-config="key=${{ vars.TF_STATE_KEY_PREFIX }}/${{ inputs.environment_name }}.tfstate"
          -backend-config="use_oidc=true"
      - name: Plan immutable deployment
        id: plan
        env:
          REQUESTED_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          IMAGE_TAG="${REQUESTED_IMAGE_TAG:-${GITHUB_SHA}}"
          DESTROY_AFTER="$(date -u -d '+${{ inputs.lifetime_hours }} hours' '+%Y-%m-%dT%H:%M:%SZ')"
          echo "destroy_after=${DESTROY_AFTER}" >> "$GITHUB_OUTPUT"
          terraform plan -input=false -lock-timeout=5m \
            -var="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}" \
            -var="environment_name=${{ inputs.environment_name }}" \
            -var="destroy_after=${DESTROY_AFTER}" \
            -var="image_tag=${IMAGE_TAG}" \
            -out=application.tfplan
      - name: Apply reviewed plan
        run: terraform apply -input=false -auto-approve application.tfplan
      - name: Smoke test happy path
        run: |
          URL="$(terraform output -raw frontend_url)"
          curl --fail --connect-timeout 10 --max-time 30 --retry 20 --retry-all-errors --retry-delay 15 "${URL}/"
          RUN="$(curl --fail --connect-timeout 10 --max-time 30 --retry 10 --retry-all-errors --retry-delay 10 \
            -H 'Content-Type: application/json' \
            -d '{"scenarioId":"happy-path","amount":129.90,"currency":"EUR"}' \
            "${URL}/api/v1/runs")"
          WORKFLOW_ID="$(jq -r '.workflowId' <<< "$RUN")"
          for _ in $(seq 1 30); do
            TIMELINE="$(curl --fail --connect-timeout 10 --max-time 30 "${URL}/api/v1/runs/${WORKFLOW_ID}/timeline")"
            if jq -e 'any(.[]; .state == "COMPLETED")' <<< "$TIMELINE" >/dev/null; then
              echo "Azure happy-path completed for ${WORKFLOW_ID}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "Happy-path did not complete" >&2
          exit 1
      - name: Smoke test public trace viewer
        run: |
          URL="$(terraform output -raw frontend_url)"
          GRAFANA_URL="$(terraform output -raw grafana_url)"
          RUN="$(curl --fail --connect-timeout 10 --max-time 30 \
            -H 'Content-Type: application/json' \
            -d '{"scenarioId":"duplicate-payment-result","amount":129.90,"currency":"EUR"}' \
            "${URL}/api/v1/runs")"
          WORKFLOW_ID="$(jq -er '.workflowId' <<< "$RUN")"

          for _ in $(seq 1 30); do
            TIMELINE="$(curl --fail --connect-timeout 10 --max-time 30 \
              "${URL}/api/v1/runs/${WORKFLOW_ID}/timeline")"
            TRACE_ID="$(jq -er \
              '[.[] | select(.duplicateDelivery == true and .state == "DUPLICATE_IGNORED")][0].traceId // empty' \
              <<< "$TIMELINE" 2>/dev/null || true)"
            COMPLETED="$(jq -r 'any(.[]; .state == "COMPLETED")' <<< "$TIMELINE")"
            if [[ -n "$TRACE_ID" && "$COMPLETED" == "true" ]]; then
              break
            fi
            sleep 5
          done

          if [[ -z "$TRACE_ID" || "$COMPLETED" != "true" ]]; then
            echo "Duplicate scenario did not expose its ignored delivery and completion" >&2
            exit 1
          fi

          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
              "${GRAFANA_URL}/api/datasources/proxy/uid/tempo/api/traces/${TRACE_ID}" \
              | jq -e '.batches | length > 0' >/dev/null; then
              echo "Public Grafana resolved duplicate trace ${TRACE_ID} for ${WORKFLOW_ID}" \
                >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done

          echo "Public Grafana could not resolve trace ${TRACE_ID}" >&2
          exit 1
      - name: Smoke test Control Center and Run Inspector
        run: |
          URL="$(terraform output -raw frontend_url)"
          STATUS="$(curl --fail --connect-timeout 10 --max-time 30 "${URL}/api/v1/deployment/status")"
          jq -e '
            .mode == "ONLINE"
            and .acceptingExperiments == true
            and (.expiresAt | type == "string")
            and ([.dependencies[] | select(.status == "UP")] | length == 3)
          ' <<< "$STATUS" >/dev/null

          RUN="$(curl --fail --connect-timeout 10 --max-time 30 \
            -H 'Content-Type: application/json' \
            -d '{"scenarioId":"custom-plan","experimentPlan":{"paymentResultDeliveries":2,"fulfilmentBehavior":"SUCCESS","fulfilmentMaxAttempts":4,"recoveryMode":"MANUAL"},"amount":129.90,"currency":"EUR"}' \
            "${URL}/api/v1/runs")"
          WORKFLOW_ID="$(jq -er '.workflowId' <<< "$RUN")"
          curl --fail --silent --show-error "${URL}/runs/${WORKFLOW_ID}" | grep -q 'id="root"'

          for _ in $(seq 1 30); do
            EVIDENCE="$(curl --fail --connect-timeout 10 --max-time 30 \
              "${URL}/api/v1/runs/${WORKFLOW_ID}/evidence")"
            if jq -e '.assessment == "PROVED" and ([.checks[] | select(.status == "PROVED")] | length == 3)' \
              <<< "$EVIDENCE" >/dev/null; then
              echo "Control Center, custom builder, direct route, and evidence report passed for ${WORKFLOW_ID}" \
                >> "$GITHUB_STEP_SUMMARY"
              break
            fi
            sleep 5
          done
          jq -e '.assessment == "PROVED"' <<< "$EVIDENCE" >/dev/null
      - name: Publish live-lab status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL="$(terraform output -raw frontend_url)"
          jq -n \
            --arg url "${URL}" \
            --arg expiresAt "${{ steps.plan.outputs.destroy_after }}" \
            --arg environment "${{ inputs.environment_name }}" \
            --arg updatedAt "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            '{state:"online", url:$url, expiresAt:$expiresAt, environment:$environment, updatedAt:$updatedAt}' \
            > ../../../frontend/public/live-lab.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ../../../frontend/public/live-lab.json
          git diff --cached --quiet || git commit -m "Publish live lab status [skip ci]"
          git push
          gh workflow run portfolio.yml --ref main
      - name: Publish environment summary
        if: always()
        run: |
          echo "### EventLab Azure environment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Expires: ${{ steps.plan.outputs.destroy_after }}" >> "$GITHUB_STEP_SUMMARY"
          terraform output -raw frontend_url 2>/dev/null | sed 's/^/- EventLab: /' >> "$GITHUB_STEP_SUMMARY" || true
          terraform output -raw grafana_url 2>/dev/null | sed 's/^/- Grafana: /' >> "$GITHUB_STEP_SUMMARY" || true
