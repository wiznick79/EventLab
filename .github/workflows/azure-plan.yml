name: Plan Azure environment

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: Short environment name
        required: true
        default: demo
      lifetime_hours:
        description: Planned lifetime
        required: true
        type: choice
        options: ['2', '8', '24']
      image_tag:
        description: Full image commit SHA; defaults to the selected branch SHA
        required: false

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: eventlab-azure-state
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: azure
    defaults:
      run:
        working-directory: infrastructure/terraform/application
    env:
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Allow this runner to reach Terraform state
        id: state_firewall
        run: |
          RUNNER_IP="$(curl --fail --silent --show-error https://api.ipify.org)"
          [[ "$RUNNER_IP" =~ ^[0-9a-fA-F:.]+$ ]] || exit 1
          echo "runner_ip=${RUNNER_IP}" >> "$GITHUB_OUTPUT"
          az storage account network-rule add --resource-group "${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            --account-name "${{ vars.TF_STATE_STORAGE_ACCOUNT }}" --ip-address "$RUNNER_IP" --only-show-errors
          for _ in $(seq 1 12); do
            az storage container show --auth-mode login --name "${{ vars.TF_STATE_CONTAINER }}" \
              --account-name "${{ vars.TF_STATE_STORAGE_ACCOUNT }}" --only-show-errors >/dev/null 2>&1 && break
            sleep 5
          done
          az storage container show --auth-mode login --name "${{ vars.TF_STATE_CONTAINER }}" \
            --account-name "${{ vars.TF_STATE_STORAGE_ACCOUNT }}" --only-show-errors >/dev/null
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.8
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Initialize remote state
        run: >-
          terraform init -input=false
          -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}"
          -backend-config="key=${{ vars.TF_STATE_KEY_PREFIX }}/${{ inputs.environment_name }}.tfstate"
          -backend-config="use_oidc=true"
      - name: Plan
        env:
          REQUESTED_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          IMAGE_TAG="${REQUESTED_IMAGE_TAG:-$(gh run list --workflow images.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha')}"
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || exit 1
          REGISTRY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/eventlab"
          declare -A REFERENCES=(
            [workflow]="$REGISTRY/workflow-service:$IMAGE_TAG" [payment]="$REGISTRY/payment-service:$IMAGE_TAG"
            [fulfilment]="$REGISTRY/fulfilment-service:$IMAGE_TAG" [console]="$REGISTRY/lab-console:$IMAGE_TAG"
            [frontend]="$REGISTRY/frontend:$IMAGE_TAG" [tempo]="$REGISTRY/frontend:$IMAGE_TAG-tempo"
            [telemetry_gateway]="$REGISTRY/frontend:$IMAGE_TAG-telemetry-gateway" [grafana]="$REGISTRY/frontend:$IMAGE_TAG-grafana"
          )
          DIGESTS='{}'
          for NAME in "${!REFERENCES[@]}"; do
            DIGEST="$(docker buildx imagetools inspect "${REFERENCES[$NAME]}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
            DIGESTS="$(jq --arg name "$NAME" --arg digest "$DIGEST" '. + {($name):$digest}' <<< "$DIGESTS")"
          done
          jq -n --argjson digests "$DIGESTS" '{image_digests:$digests}' > deployment.auto.tfvars.json
          DESTROY_AFTER="$(date -u -d '+${{ inputs.lifetime_hours }} hours' '+%Y-%m-%dT%H:%M:%SZ')"
          terraform plan -input=false -lock-timeout=5m \
            -var="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}" \
            -var="environment_name=${{ inputs.environment_name }}" \
            -var="destroy_after=${DESTROY_AFTER}" \
            -var="image_tag=${IMAGE_TAG}" \
            -out=application.tfplan
          terraform show -no-color application.tfplan >> "$GITHUB_STEP_SUMMARY"
      - name: Remove runner access to Terraform state
        if: always() && steps.state_firewall.outputs.runner_ip != ''
        run: |
          az storage account network-rule remove --resource-group "${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            --account-name "${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            --ip-address "${{ steps.state_firewall.outputs.runner_ip }}" --only-show-errors
