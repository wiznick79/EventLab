name: Publish static portfolio

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/portfolio.yml'
  workflow_dispatch:
    inputs:
      live_state:
        description: Optional live-lab state override
        required: false
      live_url:
        description: Public EventLab URL when online
        required: false
      expires_at:
        description: RFC3339 expiry when online
        required: false
      environment_name:
        description: Advertised environment
        required: false
      updated_at:
        description: RFC3339 status update time
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: eventlab-portfolio
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Preserve current live-lab status
        env:
          LIVE_STATE: ${{ inputs.live_state }}
          LIVE_URL: ${{ inputs.live_url }}
          EXPIRES_AT: ${{ inputs.expires_at }}
          ENVIRONMENT_NAME: ${{ inputs.environment_name }}
          UPDATED_AT: ${{ inputs.updated_at }}
        run: |
          if [[ "${LIVE_STATE}" == "online" ]]; then
            jq -n --arg url "${LIVE_URL}" --arg expiresAt "${EXPIRES_AT}" \
              --arg environment "${ENVIRONMENT_NAME}" --arg updatedAt "${UPDATED_AT}" \
              '{state:"online", url:$url, expiresAt:$expiresAt, environment:$environment, updatedAt:$updatedAt}' \
              > frontend/public/live-lab.json
            jq -e '.url | startswith("https://")' frontend/public/live-lab.json >/dev/null
            jq -e '.expiresAt | fromdateiso8601 > now' frontend/public/live-lab.json >/dev/null
            exit 0
          fi
          if [[ "${LIVE_STATE}" == "offline" ]]; then
            jq -n --arg environment "${ENVIRONMENT_NAME}" --arg updatedAt "${UPDATED_AT}" \
              '{state:"offline", environment:$environment, updatedAt:$updatedAt}' \
              > frontend/public/live-lab.json
            exit 0
          fi
          STATUS_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/live-lab.json"
          if STATUS="$(curl --fail --silent --show-error --max-time 10 "${STATUS_URL}")" \
            && jq -e '.state == "online" and (.url | type == "string") and (.expiresAt | fromdateiso8601 > now)' \
              <<< "${STATUS}" >/dev/null; then
            printf '%s\n' "${STATUS}" > frontend/public/live-lab.json
          fi
      - name: Build static tour
        working-directory: frontend
        run: |
          npm ci
          npm test
          VITE_STATIC_TOUR=true npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy portfolio
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
