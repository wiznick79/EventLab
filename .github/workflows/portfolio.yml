name: Publish static portfolio

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/portfolio.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: eventlab-portfolio
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Preserve current live-lab status
        run: |
          STATUS_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/live-lab.json"
          if STATUS="$(curl --fail --silent --show-error --max-time 10 "${STATUS_URL}")" \
            && jq -e '.state == "online" and (.url | type == "string") and (.expiresAt | fromdateiso8601 > now)' \
              <<< "${STATUS}" >/dev/null; then
            printf '%s\n' "${STATUS}" > frontend/public/live-lab.json
          fi
      - name: Build static tour
        working-directory: frontend
        run: |
          npm ci
          npm test
          VITE_STATIC_TOUR=true npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy portfolio
        id: deployment
        uses: actions/deploy-pages@v4
