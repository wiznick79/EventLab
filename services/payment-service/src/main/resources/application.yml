spring:
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DATABASE_URL:jdbc:postgresql://localhost:35432/payment_service}
    username: ${PAYMENT_DATABASE_USER:payment_service}
    password: ${PAYMENT_DATABASE_PASSWORD:payment-local-only}
  flyway:
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
server:
  port: ${SERVER_PORT:38082}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_TRACES_ENDPOINT:http://localhost:34318/v1/traces}

eventlab:
  messaging:
    enabled: ${EVENTLAB_MESSAGING_ENABLED:false}
    connection-string: ${EVENTLAB_SERVICEBUS_CONNECTION_STRING:Endpoint=sb://localhost;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;}
    fully-qualified-namespace: ${EVENTLAB_SERVICEBUS_FULLY_QUALIFIED_NAMESPACE:}
    payment-commands-queue: payment-commands
    business-events-topic: business-events
