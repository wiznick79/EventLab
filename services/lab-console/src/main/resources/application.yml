spring:
  application:
    name: lab-console
  datasource:
    url: ${LAB_CONSOLE_DATABASE_URL:jdbc:postgresql://localhost:35432/lab_console}
    username: ${LAB_CONSOLE_DATABASE_USER:lab_console}
    password: ${LAB_CONSOLE_DATABASE_PASSWORD:console-local-only}
  flyway:
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
server:
  port: ${SERVER_PORT:38080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_TRACES_ENDPOINT:http://localhost:34318/v1/traces}

eventlab:
  workflow-base-url: ${WORKFLOW_SERVICE_BASE_URL:http://localhost:38081}
  payment-base-url: ${PAYMENT_SERVICE_BASE_URL:http://localhost:38082}
  fulfilment-base-url: ${FULFILMENT_SERVICE_BASE_URL:http://localhost:38083}
  grafana-base-url: ${GRAFANA_BASE_URL:http://localhost:33000}
  messaging:
    enabled: ${EVENTLAB_MESSAGING_ENABLED:false}
    connection-string: ${EVENTLAB_SERVICEBUS_CONNECTION_STRING:Endpoint=sb://localhost;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;}
    fully-qualified-namespace: ${EVENTLAB_SERVICEBUS_FULLY_QUALIFIED_NAMESPACE:}
    payment-commands-queue: payment-commands
    fulfilment-commands-queue: fulfilment-commands
    business-events-topic: business-events
    workflow-events-subscription: workflow-events
    lab-console-events-subscription: lab-console-events
  deployment:
    environment: ${DEPLOYMENT_ENVIRONMENT:local}
    version: ${DEPLOYMENT_VERSION:development}
    expires-at: ${DEPLOYMENT_EXPIRES_AT:}
    read-only-lead-seconds: ${DEPLOYMENT_READ_ONLY_LEAD_SECONDS:600}
    max-runs-per-minute: ${DEPLOYMENT_MAX_RUNS_PER_MINUTE:120}
