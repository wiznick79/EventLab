name: eventlab

services:
  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_USER: ${EVENTLAB_POSTGRES_USER:-eventlab}
      POSTGRES_PASSWORD: ${EVENTLAB_POSTGRES_PASSWORD:-eventlab-local-only}
      POSTGRES_DB: eventlab
    ports:
      - "${EVENTLAB_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - eventlab-postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro

  servicebus-sql:
    image: mcr.microsoft.com/azure-sql-edge:latest@sha256:902628a8be89e35dfb7895ca31d602974c7bafde4d583a0d0873844feb1c42cf
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA:-N}
      MSSQL_SA_PASSWORD: ${SERVICEBUS_SQL_PASSWORD:-EventLab-Sb1-Local!}
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q 'SELECT 1' -b -o /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    volumes:
      - servicebus-sql-data:/var/opt/mssql

  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest@sha256:5a96d893b245031740f7d46e0fe5ff282d24b78c4b7d761dd57590f3f010a9b3
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA:-N}
      SQL_SERVER: servicebus-sql
      MSSQL_SA_PASSWORD: ${SERVICEBUS_SQL_PASSWORD:-EventLab-Sb1-Local!}
    depends_on:
      servicebus-sql:
        condition: service_healthy
    ports:
      - "5672:5672"
      - "5300:5300"
    volumes:
      - ./infrastructure/servicebus/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro

  tempo:
    image: grafana/tempo:2.10.7@sha256:032b3acb51ed02c4b801473d54bb63e9e9f13738d215126d9843c30283794f4b
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infrastructure/tempo/tempo.yml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.131.1@sha256:c06aa6d7833e9a2b81c6c394d67e40ae9864edec8dca8a8e8552df1316c96d9b
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./infrastructure/otel/collector.yml:/etc/otelcol/config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - tempo

  grafana:
    image: grafana/grafana:13.1.3@sha256:ab5cb380e3ff3172d6c8bd2e7cfd31cce977d2881b260e1f5bc089bf0b759b43
    environment:
      TEMPO_URL: http://tempo:3200
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # The lab links directly to Explore; Viewers can query and make only temporary edits.
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - tempo

  k6:
    image: grafana/k6:2.2.0@sha256:9bd01d6941fca969cb61bb57d2da5ee9b385fe2aa8881df3798c196564d6ace6
    profiles: [performance]
    working_dir: /tests
    entrypoint: ["k6"]
    command: ["run", "baseline.js"]
    environment:
      BASE_URL: ${EVENTLAB_K6_BASE_URL:-http://host.docker.internal:8080}
      HAPPY_ITERATIONS: ${EVENTLAB_K6_HAPPY_ITERATIONS:-10}
      DUPLICATE_ITERATIONS: ${EVENTLAB_K6_DUPLICATE_ITERATIONS:-3}
      COMPLETION_TIMEOUT_SECONDS: ${EVENTLAB_K6_COMPLETION_TIMEOUT_SECONDS:-20}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./performance:/tests:ro
      - ./performance/results:/results

volumes:
  eventlab-postgres-data:
  servicebus-sql-data:
  tempo-data:
  grafana-data:
