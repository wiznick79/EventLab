limit_req_zone $binary_remote_addr zone=eventlab_api:10m rate=12r/s;
limit_conn_zone $binary_remote_addr zone=eventlab_connections:10m;
map $http_x_forwarded_proto $eventlab_hsts {
    default "";
    https "max-age=31536000; includeSubDomains";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32k;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' https://fonts.gstatic.com; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security $eventlab_hsts always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /runtime-config.js {
        default_type application/javascript;
        add_header Cache-Control "no-store";
        return 200 'window.EVENTLAB_CONFIG = {"grafanaBaseUrl":"${GRAFANA_BASE_URL}"};';
    }

    location ~ "^/api/v1/runs/[0-9a-fA-F-]{36}/stream$" {
        limit_conn eventlab_connections 4;
        proxy_pass https://${LAB_CONSOLE_HOST};
        proxy_ssl_server_name on;
        proxy_ssl_name ${LAB_CONSOLE_HOST};
        proxy_http_version 1.1;
        proxy_set_header Host ${LAB_CONSOLE_HOST};
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 6m;
    }

    location /api/ {
        limit_req zone=eventlab_api burst=40 nodelay;
        limit_conn eventlab_connections 12;
        proxy_pass https://${LAB_CONSOLE_HOST};
        proxy_ssl_server_name on;
        proxy_ssl_name ${LAB_CONSOLE_HOST};
        proxy_http_version 1.1;
        proxy_set_header Host ${LAB_CONSOLE_HOST};
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
    }

    location /grafana/ {
        limit_req zone=eventlab_api burst=20 nodelay;
        limit_conn eventlab_connections 6;
        proxy_pass https://${GRAFANA_HOST}/;
        proxy_ssl_server_name on;
        proxy_ssl_name ${GRAFANA_HOST};
        proxy_http_version 1.1;
        proxy_set_header Host ${GRAFANA_HOST};
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
